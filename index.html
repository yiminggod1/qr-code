<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="QR Code Generator">
<meta name="description" content="Create a free QR code from any URL or text. Generate and download a QR code instantly in your browser.">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Free QR Code Generator">
<meta property="og:description" content="Create and download QR codes instantly from any URL or text.">
<meta property="og:type" content="website">
<title>Free QR Code Generator - Create QR Codes Instantly</title>
<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<script src="js/qrcode.min.js"></script>
<style>
body{padding-bottom:90px}
#qrcode{margin-top:20px;min-height:20px}
#qrcode img,#qrcode canvas{max-width:min(512px,100%);height:auto}
.container{padding-top:32px}
.hero-text{max-width:720px;margin:0 auto 24px}
.tool-card{max-width:760px;margin:0 auto}
.footer{position:fixed;bottom:0;width:100%;background:#f8f9fa;padding:12px}
.footer p{margin:0;font-size:.9rem}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<main class="container">
<header class="hero-text text-center">
<h1>Free QR Code Generator</h1>
<p class="lead">Create a QR code from any URL or text and download it instantly.</p>
</header>
<section class="tool-card" aria-labelledby="generator-title">
<h2 id="generator-title" class="sr-only">QR Code Generator</h2>
<div class="input-group mb-3">
<label for="text" class="sr-only">URL or text</label>
<input id="text" type="text" class="form-control" placeholder="Enter a URL or text" aria-label="URL or text for creating a QR code" autocomplete="off">
<div class="input-group-append"><button id="generateButton" class="btn btn-primary" type="button">Generate QR Code</button></div>
</div>
<div id="message" class="text-center text-danger mb-2" role="alert" aria-live="polite"></div>
<div id="qrcode" class="d-flex justify-content-center" aria-live="polite"></div>
<p id="urlText" class="text-center text-break mt-3 mb-3"></p>
<div class="d-flex justify-content-center"><button id="downloadButton" class="btn btn-outline-primary btn-lg" type="button" hidden>Download QR Code</button></div>
</section>
<section class="hero-text mt-5 text-center">
<h2>Simple, fast, and free</h2>
<p>Create QR codes directly in your browser. No account or upload is required for basic QR code generation.</p>
</section>
</main>
<footer class="footer"><p class="text-center">Built with <a href="https://davidshimjs.github.io/qrcodejs/" target="_blank" rel="noopener noreferrer">qrcode.js</a> and <a href="https://getbootstrap.com/" target="_blank" rel="noopener noreferrer">Bootstrap</a>.</p></footer>
<script>
const textInput=document.getElementById('text'),qrElem=document.getElementById('qrcode'),urlText=document.getElementById('urlText'),downloadButton=document.getElementById('downloadButton'),generateButton=document.getElementById('generateButton'),message=document.getElementById('message');
function generateQRCode(){const text=textInput.value.trim();if(!text){message.textContent='Please enter a URL or text.';textInput.focus();return}message.textContent='';qrElem.innerHTML='';new QRCode(qrElem,{text:text,width:512,height:512,correctLevel:QRCode.CorrectLevel.M});urlText.textContent=text;downloadButton.hidden=false}
function downloadQRCode(){const canvas=qrElem.querySelector('canvas'),image=qrElem.querySelector('img');if(canvas){const link=document.createElement('a');link.download='qrcode.png';link.href=canvas.toDataURL('image/png');link.click()}else if(image){const link=document.createElement('a');link.download='qrcode.png';link.href=image.src;link.target='_blank';link.click()}}
generateButton.addEventListener('click',generateQRCode);
textInput.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();generateQRCode()}});
downloadButton.addEventListener('click',downloadQRCode);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{const swPath=new URL('service-worker.js',window.location).pathname;navigator.serviceWorker.register(swPath).catch(err=>console.log('ServiceWorker registration failed:',err))})}
</script>
</body>
</html>
